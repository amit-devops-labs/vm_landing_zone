name: Terraform Pipeline

on:
  push:
    branches:
      - "feature/*"
      - main

permissions:
  contents: read

jobs:

  # =========================================================
  # FEATURE + MAIN : TERRAFORM PLAN
  # =========================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # 3. Setup TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      # 4. Run TFLint
      - name: Run TFLint
        working-directory: ./azure_landing_zone/environment/dev
        run: |
          tflint --init
          tflint

      # 5. Checkov - IaC Security Scan
      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        working-directory: ./azure_landing_zone/environment/dev
        run: checkov -d . --framework terraform

      # 5. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 6. Terraform Init
      - name: Terraform Init
        working-directory: ./azure_landing_zone/environment/dev
        run: terraform init

      # 7. Terraform Validate
      - name: Terraform Validate
        working-directory: ./azure_landing_zone/environment/dev
        run: terraform validate

      # 8. Terraform Plan
      - name: Terraform Plan
        working-directory: ./azure_landing_zone/environment/dev
        run: terraform plan


  # =========================================================
  # MAIN ONLY : MANUAL APPROVAL + TERRAFORM APPLY
  # =========================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    # Apply starts only after Plan succeeds
    needs: terraform-plan

    # Apply only on main branch
    if: github.ref == 'refs/heads/main'

    # GitHub Environment
    # Required reviewer will approve before Apply
    environment:
      name: Production

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 4. Terraform Init
      - name: Terraform Init
        working-directory: ./azure_landing_zone/environment/dev
        run: terraform init

      # 5. Terraform Apply
      - name: Terraform Apply
        working-directory: ./azure_landing_zone/environment/dev
        run: terraform apply -auto-approve